# Place this file at the root of the Azure Repos Git repository (Section C.1).
# Azure DevOps -> Pipelines -> New pipeline -> Azure Repos Git -> this repository ->
# "Existing Azure Pipelines YAML file" -> /azure-pipelines.yml.
#
# Builds every project in the solution (web app, Functions project, Helpers library,
# Tests project), runs the GiftOfTheGivers.Tests suite, and publishes the
# GiftOfTheGivers.Helpers NuGet package to the Azure Artifacts feed (Section D).

trigger:
  branches:
    include:
      - main

# Feature branches are validated on every push as well, so a branch is known to build
# before its pull request is completed (Section B.2).
pr:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  helpersProject: 'GiftOfTheGivers.Helpers/GiftOfTheGivers.Helpers.csproj'
  testProject: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'
  # The feed is project-scoped, so its URL carries the project segment. An organisation-scoped
  # URL (pkgs.dev.azure.com/ST10448224/_packaging/...) fails with TF1600011 "the feed doesn't
  # exist", which is what an earlier run of this pipeline hit.
  artifactsFeedUrl: 'https://pkgs.dev.azure.com/ST10448224/GiftOfTheGivers-Relief/_packaging/GiftOfTheGivers-Packages/nuget/v3/index.json'
  packageOutput: '$(Build.ArtifactStagingDirectory)/nupkg'
  testResultsDir: '$(Agent.TempDirectory)/TestResults'

steps:
  - task: UseDotNet@2
    displayName: 'Use .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  # Obtains a short-lived credential for the private Azure Artifacts feed using the
  # pipeline's own build-service identity. No personal access token is stored in the
  # repository or in the YAML (Section D.2).
  - task: NuGetAuthenticate@1
    displayName: 'Authenticate to Azure Artifacts'

  - task: DotNetCoreCLI@2
    displayName: 'Restore'
    inputs:
      command: 'restore'
      projects: '**/*.csproj'
      feedsToUse: 'config'
      nugetConfigPath: 'nuget.config'

  - task: DotNetCoreCLI@2
    displayName: 'Build'
    inputs:
      command: 'build'
      projects: '**/*.csproj'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # publishTestResults is turned off here so the results are published once, by the
  # explicit PublishTestResults step below, from a known folder.
  - task: DotNetCoreCLI@2
    displayName: 'Run tests'
    inputs:
      command: 'test'
      projects: '$(testProject)'
      arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory $(testResultsDir)'
      publishTestResults: false

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(testResultsDir)'
      failTaskOnFailedTests: true

  - task: DotNetCoreCLI@2
    displayName: 'Pack GiftOfTheGivers.Helpers'
    inputs:
      command: 'pack'
      packagesToPack: '$(helpersProject)'
      configuration: '$(buildConfiguration)'
      nobuild: true
      versioningScheme: 'off'
      packDirectory: '$(packageOutput)'

  # Only the main branch publishes to the feed, so a pull-request validation build never
  # produces a package version that was not actually merged.
  #
  # This is a script step rather than the DotNetCoreCLI@2 push command because that task's
  # allowPackageConflicts input is not passed through to `dotnet nuget push`: an unchanged
  # version still returns 409 Conflict and fails the build. --skip-duplicate is the flag
  # dotnet itself offers for this, and Azure Artifacts feeds are immutable, so re-publishing
  # an unchanged 1.0.0 is a no-op rather than an overwrite. Credentials come from the
  # NuGetAuthenticate@1 task above, so --api-key is only a placeholder dotnet requires.
  - script: >
      dotnet nuget push "$(packageOutput)/*.nupkg"
      --source "$(artifactsFeedUrl)"
      --api-key AzureDevOps
      --skip-duplicate
    displayName: 'Push GiftOfTheGivers.Helpers to Azure Artifacts'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - task: PublishBuildArtifacts@1
    displayName: 'Publish package as build artifact'
    condition: succeededOrFailed()
    inputs:
      pathToPublish: '$(packageOutput)'
      artifactName: 'nupkg'
